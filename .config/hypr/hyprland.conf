nv = QT_FFMPEG_DECODING_HW_DEVICE_TYPES,none

# Force the pet window to float instead of tiling
windowrulev2 = float, class:^(wpets)$
windowrulev2 = float, class:^(openpets)$
windowrulev2 = float, class:^(shijima)$
windowrulev2 = float, class:^(waifuland)$

# Keep it pinned across workspaces and ignore tiling layouts
#windowrulev2 = pin, class:^(wpets)$
#windowrulev2 = pin, class:^(waifuland)&
# Prevent Hyprland shadows, borders, or blurs from drawing around the invisible frame



misc {
    # 0 = disabled, 1 = track first window, 2 = track windows and subsequent child windows
    initial_workspace_tracking = 2
}


# Force rmpc and cava onto workspace 2 and split them
#windowrulev2 = workspace 2, title:^(rmpc-window)$
#windowrulev2 = workspace 2, title:^(cava-window)$
#windowrulev2 = workspace 2, title:^(btop-window)$

#custom keybinds


bind = SUPER, ALT, M, exec, /usr/lib/jvm/java-21-openjdk/bin/java -jar /home/ciel/.local/share/sklauncher/sklauncher.jar
